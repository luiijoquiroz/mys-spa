<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F0EFED" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- REEMPLAZAR: url canónica cuando exista el dominio (D1 del plan) -->
    <title>Mys Spa | Estética facial y cosmetología en Providencia</title>
    <meta
      name="description"
      content="Limpiezas faciales, exfoliaciones, peelings y ácido hialurónico con evaluación previa, en Providencia, a pasos del Metro Tobalaba. Procedimientos médicos con la Dra. Camila Carrazco. Reserva por WhatsApp."
    />
    <meta
      name="keywords"
      content="limpieza facial Providencia, cosmetología Santiago, peeling químico, ácido hialurónico, exfoliación facial, estética facial Metro Tobalaba"
    />

    <!-- ====== Open Graph (Instagram / Facebook / WhatsApp) ====== -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Mys Spa" />
    <meta property="og:title" content="Mys Spa | Piel sana, luz propia" />
    <meta
      property="og:description"
      content="Estética facial y cosmetología en Providencia. Evaluación previa en cada atención. Reserva tu hora por WhatsApp."
    />
    <meta property="og:image" content="/img/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mys Spa | Piel sana, luz propia" />
    <meta
      name="twitter:description"
      content="Estética facial y cosmetología en Providencia, Santiago. Reserva por WhatsApp."
    />
    <meta name="twitter:image" content="/img/og-image.jpg" />

    <!-- ====== Tipografías (las del manual: serif clásica + sans geométrica) ====== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- ====== Datos estructurados ====== -->
    <!-- REEMPLAZAR: url, telephone, openingHours, image cuando lleguen los datos reales -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Mys Spa",
        "description": "Estética facial y cosmetología en Providencia, Santiago: limpieza facial profunda, exfoliación, peeling químico y ácido hialurónico con evaluación previa.",
        "image": "/img/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Luis Thayer Ojeda 157",
          "addressLocality": "Providencia",
          "addressRegion": "Región Metropolitana",
          "addressCountry": "CL"
        },
        "areaServed": "Providencia, Santiago",
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
